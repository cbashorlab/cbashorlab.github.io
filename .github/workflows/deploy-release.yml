# ==============================================================================
# NAME: Build, Release, and Deploy Astro Site
# PURPOSE: Automates the CI/CD pipeline for an Astro project. 
#          It handles dual-building the site (one optimized for GitHub Pages 
#          sub-paths and one clean root build), deploying to GitHub Pages, 
#          and bundling a production release asset triggered by code changes.
# ==============================================================================

name: Build, Release, and Deploy Astro Site

# FUNCTIONALITY: Defines what triggers this automated workflow.
on:
  # Triggers the workflow automatically whenever code is pushed to the 'main' branch.
  push:
    branches: [ main ]
  # Allows repository maintainers to manually trigger this workflow from the GitHub Actions UI.
  workflow_dispatch:

# FUNCTIONALITY: Configures the security permissions for the GITHUB_TOKEN.
# PURPOSE: Grants the minimal necessary privileges for this specific workflow to run.
permissions:
  contents: write   # Required to create releases and upload release assets.
  pages: write      # Required to deploy content to GitHub Pages.
  id-token: write   # Required for secure authentication with GitHub Pages.

jobs:
  # ----------------------------------------------------------------------------
  # JOB 1: BUILD BOTH VERSIONS OF THE SITE
  # PURPOSE: Installs project dependencies and builds two distinct flavors of 
  #          the Astro production site to serve different deployment targets.
  # ----------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest # Executes the job in a fresh, cloud-hosted Ubuntu environment.
    steps:
      # Step 1: Pull down the repository source code so the workflow can access it.
      - name: Checkout repository
        uses: actions/checkout@v6

      # Step 2: Initialize Node.js environment with caching enabled to speed up subsequent runs.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # Uses Node.js v24 as the runtime.
          cache: 'npm'     # Caches npm dependencies to optimize build times.

      # Step 3: Install precise project dependencies.
      # PURPOSE: 'npm ci' ensures clean, automated, and reproducible builds based exactly on package-lock.json.
      - name: Install dependencies
        run: npm ci

      # --- BUILD FLAVOR 1: GITHUB PAGES ---
      # PURPOSE: Generates production files configured specifically for a sub-folder/repository-name URL structure.
      - name: Build for GitHub Pages
        run: npx astro build

      # Step 4: Package and upload the GitHub Pages build output.
      # PURPOSE: Converts the 'dist' folder into a specialized artifact format that the 'deploy' job requires.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # --- BUILD FLAVOR 2: CLEAN RELEASE ZIP ---
      # PURPOSE: Overwrites 'dist' with a standardized build that assumes the site lives at the root domain ('/'). 
      #          This ensures the resulting ZIP is portable and not hardcoded to GitHub Pages' sub-path.
      - name: Build clean production site for Release
        run: npx astro build 

      # Step 5: Persist the clean build files across jobs.
      # PURPOSE: Saves the clean 'dist' folder to GitHub cloud storage so Job 3 (release) can access it.
      - name: Upload clean build for Release Job
        uses: actions/upload-artifact@v7
        with:
          name: clean-release-dist
          path: dist

  # ----------------------------------------------------------------------------
  # JOB 2: DEPLOY TO GITHUB PAGES
  # PURPOSE: Takes the specialized pages artifact and publishes it to the web.
  # ----------------------------------------------------------------------------
  deploy:
    needs: build # Direct dependency: Prevents deployment if the compilation/build job fails.
    runs-on: ubuntu-latest
    environment:
      name: github-pages # Ties the job to GitHub's deployment environment rules and tracking.
      url: ${{ steps.deployment.outputs.page_url }} # Dynamically extracts and links the public URL in the UI.
    steps:
      # Step 1: Consume the artifact generated by 'upload-pages-artifact' and publish it live.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ----------------------------------------------------------------------------
  # JOB 3: CREATE THE GITHUB RELEASE
  # PURPOSE: Packages the root-configured production files into a production-ready 
  #          ZIP file and attaches it to an official GitHub Release.
  # ----------------------------------------------------------------------------
  release:
    needs: build # Direct dependency: Ensures a release is only made if the build succeeds.
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out code to gain access to the repository context and metadata.
      - name: Checkout repository
        uses: actions/checkout@v6

      # Step 2: Fetch the clean root-built site files that were saved in Job 1.
      - name: Download clean build artifact
        uses: actions/download-artifact@v8
        with:
          name: clean-release-dist
          path: ./dist # Places the downloaded files into the './dist' folder.

      # Step 3: Compress the build files.
      # PURPOSE: Changes directory into 'dist' to avoid nesting the parent folder, archives 
      #          all contents using the unique Git Commit SHA as the file name, and returns.
      - name: Zip release artifact
        run: |
          cd dist
          zip -r ../astro-build-${{ github.sha }}.zip .
          cd ..

      # Step 4: Publish the GitHub Release.
      # PURPOSE: Automatically cuts a new, non-draft release tagged with the unique 
      #          Git Commit SHA and attaches the portable ZIP file as a downloadable asset.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: release-${{ github.sha }}
          name: Release ${{ github.sha }}
          draft: false
          prerelease: false
          files: astro-build-${{ github.sha }}.zip